<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Desi Mirror · Wardrobe Remote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Baloo+2:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --wall: #6a1428;
        --ink: #2b1216;
        --cream: #fff3e0;
        --gold: #f3d77a;
        --marigold: #f29f05;
        --haldi: #f6c90e;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--wall);
        color: var(--cream);
        font-family: "Baloo 2", system-ui, sans-serif;
        overflow: hidden;
        user-select: none;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px 24px;
        gap: 12px;
      }
      h1 { font-family: "Rozha One", Georgia, serif; color: var(--haldi); margin: 0; font-size: 34px; line-height: 1; }
      .sub { margin: 0; opacity: 0.85; font-size: 15px; }
      .card {
        width: 100%;
        max-width: 420px;
        background: rgba(0, 0, 0, 0.18);
        border: 2px solid rgba(255, 243, 224, 0.25);
        border-radius: 18px;
        padding: 14px;
        text-align: center;
      }
      .now { font-size: 14px; opacity: 0.8; margin: 0; }
      .outfit { font-family: "Rozha One", Georgia, serif; font-size: 30px; margin: 2px 0 0; color: var(--cream); }
      .wearing { font-size: 14px; margin: 4px 0 0; color: var(--gold); min-height: 20px; }
      .hanger {
        width: 120px; height: 120px; margin: 6px auto 0;
        transition: transform 0.12s linear;
        font-size: 84px; line-height: 120px;
      }
      .row { display: flex; gap: 10px; width: 100%; max-width: 420px; }
      button {
        flex: 1;
        font-family: "Baloo 2", system-ui, sans-serif;
        font-weight: 700;
        font-size: 22px;
        padding: 16px 8px;
        border-radius: 999px;
        border: 3px solid var(--ink);
        background: var(--cream);
        color: var(--ink);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
      }
      button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); }
      .wear { background: var(--gold); }
      .toss { background: var(--marigold); }
      .help { font-size: 14px; opacity: 0.85; text-align: center; line-height: 1.5; margin: 0; }
      .status { font-size: 13px; opacity: 0.7; margin-top: auto; }
      #start {
        position: fixed; inset: 0;
        background: rgba(60, 8, 22, 0.96);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 16px; padding: 24px; text-align: center;
      }
      #start button { flex: none; width: 240px; background: var(--haldi); }
    </style>
  </head>
  <body>
    <main>
      <h1>Desi Mirror</h1>
      <p class="sub">wardrobe remote · room <b id="room">----</b></p>
      <div class="card">
        <p class="now">on the rail</p>
        <p class="outfit" id="outfit">…</p>
        <div class="hanger" id="hanger">👗</div>
        <p class="wearing" id="wearing"></p>
      </div>
      <p class="help">tilt left / right to browse<br />flick the phone down to toss it on the floor<br />tap <b>wear</b> to put it on</p>
      <div class="row">
        <button id="prev">◀</button>
        <button id="next">▶</button>
      </div>
      <div class="row">
        <button class="toss" id="toss">toss</button>
        <button class="wear" id="wear">wear</button>
      </div>
      <p class="status" id="status">connecting…</p>
    </main>
    <div id="start">
      <h1>Desi Mirror</h1>
      <p class="sub">your phone is the wardrobe</p>
      <button id="go">start</button>
      <p class="help">allow motion access when asked</p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <script src="js/phone.js"></script>
  </body>
</html>
